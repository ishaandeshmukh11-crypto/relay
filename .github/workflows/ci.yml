name: ci
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: code/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: code/api/package-lock.json
      - run: node -v
      - run: npm ci
      - run: node --check server.js
      - run: node --check relay/routes.js
      - name: Sequential backend tests
        env:
          BATCH1_MONGO: mongodb://127.0.0.1:27017/relay_ci_batch1
          BATCH2_MONGO: mongodb://127.0.0.1:27017/relay_ci_batch2
          BATCH3_MONGO: mongodb://127.0.0.1:27017/relay_ci_batch3
        run: npm test
      - run: npm audit --omit=dev
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: code/web/package-lock.json
      - run: node -v
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
