# Local/staging Compose for Relay. Uses Node 24 images built from Dockerfiles.
# Secrets: copy staging/.env.staging.example -> staging/.env.staging and fill via secret manager values.
# Never point this file at production Atlas or production Stripe keys.
name: twwios-relay-staging

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - relay_staging_mongo:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./code/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./staging/.env.staging
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/twwios_relay_staging
      CORS_ORIGIN: ${STAGING_WEB_ORIGIN:-http://localhost:3000}
      PUBLIC_URL: ${STAGING_WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  web:
    build:
      context: ./code/web
      dockerfile: Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

volumes:
  relay_staging_mongo:
