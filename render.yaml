# TWWIOS Relay API — Render Blueprint (no secrets embedded).
# Set sensitive values in the Render dashboard. Do not commit real credentials.
services:
  - type: web
    name: twwios-relay-api
    runtime: node
    rootDir: code/api
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ENC_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RELAY_ADMIN_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
